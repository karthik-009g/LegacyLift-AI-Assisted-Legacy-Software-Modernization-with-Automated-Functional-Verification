[build-system]
requires = ["setuptools>=65", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "legacylift"
version = "0.1.0"
description = "Evidence-grounded modernization and functional verification for selected legacy workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "fastapi>=0.134,<1",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "rq>=2,<3",
    "redis>=6,<8",
    "uvicorn>=0.34,<1",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-ruby>=0.23,<0.24",
    "rank-bm25>=0.2,<0.3",
    "python-multipart>=0.0.20,<1",
]

[project.scripts]
legacylift = "legacylift.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["legacylift*"]

[tool.setuptools.package-data]
"legacylift.runtimes" = ["assets/*.rb", "assets/*.yml", "assets/*.py", "assets/*.txt", "assets/*.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
