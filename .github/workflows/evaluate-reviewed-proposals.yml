name: Evaluate reviewed model proposals

on:
  workflow_dispatch:
    inputs:
      proposal_run_id:
        description: Run ID from a successful "Generate AI proposals" workflow
        required: true
        type: string
      human_reviewed:
        description: I inspected all three proposed_code fields and approve evaluation
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit human review
        if: ${{ inputs.human_reviewed != true }}
        run: |
          echo "::error::Review all three proposals, then dispatch again with human_reviewed enabled."
          exit 1
      - uses: actions/checkout@v4
        if: ${{ inputs.human_reviewed == true }}
      - uses: actions/setup-python@v5
        if: ${{ inputs.human_reviewed == true }}
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and project
        if: ${{ inputs.human_reviewed == true }}
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable .
      - name: Validate proposal run provenance
        if: ${{ inputs.human_reviewed == true }}
        id: source-run
        uses: actions/github-script@v7
        env:
          PROPOSAL_RUN_ID: ${{ inputs.proposal_run_id }}
        with:
          script: |
            const raw = process.env.PROPOSAL_RUN_ID || "";
            if (!/^\d+$/.test(raw)) {
              core.setFailed("proposal_run_id must contain only digits");
              return;
            }
            const runId = Number(raw);
            if (!Number.isSafeInteger(runId)) {
              core.setFailed("proposal_run_id is outside the supported integer range");
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const workflowPath = (run.path || "").split("@")[0];
            if (workflowPath !== ".github/workflows/generate-groq-proposals.yml") {
              core.setFailed("The selected run did not generate model proposals");
              return;
            }
            if (run.status !== "completed" || run.conclusion !== "success") {
              core.setFailed("The selected proposal run did not complete successfully");
              return;
            }
            if (run.head_branch !== "main") {
              core.setFailed("The proposal run must use the repository's main branch");
              return;
            }
            if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("The proposal run belongs to a different repository");
              return;
            }
            core.setOutput("run_id", String(runId));
      - name: Download reviewed proposal artifact
        if: ${{ inputs.human_reviewed == true }}
        uses: actions/download-artifact@v4
        with:
          name: model-proposals
          path: artifacts/proposals
          run-id: ${{ steps.source-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Validate all proposal files
        if: ${{ inputs.human_reviewed == true }}
        run: |
          python - <<'PY'
          from pathlib import Path

          from legacylift.reconstruction.models import ReconstructionProposal

          root = Path("artifacts/proposals")
          for condition in ("source_only", "runtime_only", "hybrid"):
              path = root / f"{condition}.json"
              proposal = ReconstructionProposal.model_validate_json(path.read_text(encoding="utf-8"))
              if proposal.provider not in {"gemini", "groq"} or proposal.condition != condition:
                  raise SystemExit(f"Invalid provider or condition in {path.name}")
              if not proposal.proposed_code or not proposal.proposed_code.strip():
                  raise SystemExit(f"No code was generated in {path.name}")
              if not proposal.requires_human_review:
                  raise SystemExit(f"Human-review flag missing in {path.name}")
          PY
      - name: Build reviewed-candidate evaluation image
        if: ${{ inputs.human_reviewed == true }}
        run: docker build --file Dockerfile.evaluation --tag legacylift-evaluation:py311 .
      - name: Evaluate all three reviewed proposals
        if: ${{ inputs.human_reviewed == true }}
        run: >-
          python -m legacylift evaluate-proposals --human-reviewed
          --proposal-directory artifacts/proposals
          --output artifacts/proposals/model_generated_comparison.json
      - name: Upload comparison report
        if: ${{ always() && inputs.human_reviewed == true }}
        uses: actions/upload-artifact@v4
        with:
          name: model-generated-comparison
          path: artifacts/proposals/model_generated_comparison.json
          if-no-files-found: ignore
          retention-days: 30
