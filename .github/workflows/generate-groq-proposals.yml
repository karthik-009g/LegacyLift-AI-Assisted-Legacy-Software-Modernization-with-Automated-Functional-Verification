name: Generate AI proposals (Gemini primary, Groq fallback)

on:
  workflow_dispatch:
    inputs:
      confirm_free_tier:
        description: I confirm both accounts are on their free tiers and approve three primary requests plus any fallbacks
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  proposals:
    runs-on: ubuntu-latest
    steps:
      - name: Require free-tier confirmation
        if: ${{ inputs.confirm_free_tier != true }}
        run: |
          echo "::error::Confirm both provider accounts are on their free tiers before generating proposals."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and project
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable .
      - name: Generate one proposal for each evidence condition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          for condition in source_only runtime_only hybrid; do
            python -m legacylift propose --condition "$condition"
          done
      - name: Upload proposals for review
        uses: actions/upload-artifact@v4
        with:
          name: model-proposals
          path: artifacts/proposals/*.json
          if-no-files-found: error
          retention-days: 7
